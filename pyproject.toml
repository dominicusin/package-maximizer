[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "package-maximizer"
description = "Модульная система для максимизации непротиворечивого множества пакетов"
authors = [{name = "Package Maximizer Team", email = "team@package-maximizer.dev"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["package", "maximizer", "sat", "ilp", "smt", "apt", "z3", "pulp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Software Distribution",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dynamic = ["version"]
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "psutil>=5.8.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
web = [
    "flask>=2.0.0",
    "werkzeug>=2.0,<4",
    "gunicorn>=20.0.0",
]
tui = [
    "textual>=0.40.0",
]
solvers = [
    "z3-solver>=4.8.0",
    "pulp>=2.5.0",
    "ortools>=9.0.0",
    "python-sat>=0.1.7.dev6",
]
viz = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]
all = [
    "package-maximizer[web,solvers,viz,tui]",
]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=3.0.0",
    "black>=21.0.0",
    "flake8>=4.0.0",
    "mypy>=0.910",
    "isort>=5.0.0",
    "pre-commit>=2.15.0",
]

[project.scripts]
package-maximizer = "package_maximizer.cli.main:cli"
pm-web = "package_maximizer.web.app:run_app"

[project.urls]
Homepage = "https://github.com/dominicusin/package-maximizer"
Documentation = "https://package-maximizer.readthedocs.io/"
Repository = "https://github.com/dominicusin/package-maximizer.git"
"Bug Tracker" = "https://github.com/dominicusin/package-maximizer/issues"
PyPI = "https://pypi.org/project/package-maximizer/"

[project.entry-points."package_maximizer.parsers"]
apt = "package_maximizer.parsers.apt_parser:APTParser"
pacman = "package_maximizer.parsers.pacman_parser:PacmanParser"
dnf = "package_maximizer.parsers.dnf_parser:DNFParser"
brew = "package_maximizer.parsers.brew_parser:BrewParser"
pip = "package_maximizer.parsers.extra_parsers:PipParser"
npm = "package_maximizer.parsers.extra_parsers:NpmParser"
cargo = "package_maximizer.parsers.extra_parsers:CargoParser"
snap = "package_maximizer.parsers.extra_parsers:SnapParser"
flatpak = "package_maximizer.parsers.extra_parsers:FlatpakParser"

[tool.mypy]
ignore_missing_imports = true
# Exclude files with complex type issues from mypy
[[tool.mypy.overrides]]
module = [
    "package_maximizer.analyzers.result_analyzer",
    "package_maximizer.parsers.extra_parsers",
    "package_maximizer.cli.main",
    "package_maximizer.web.app",
]
ignore_errors = true

[tool.setuptools_scm]
fallback_version = "0.8.0"

[tool.package-maximizer]
plugin-metadata-version = "1"
