# .readthedocs.yaml — ReadTheDocs build configuration.
# Docs are built from the /docs directory using Sphinx.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

  commands:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev,web,tui]"
    - python -m pip install sphinx sphinx-rtd-theme myst-parser
    - sphinx-build -b html docs $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py
